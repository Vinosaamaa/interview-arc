name: Repair bounded Solution Profile revisions

on:
  workflow_dispatch:

concurrency:
  group: solution-profile-revision-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOLUTION_PROFILE_REPAIR_INPUT_GZIP_1: ${{ secrets.SOLUTION_PROFILE_REPAIR_INPUT_GZIP_1 }}
      SOLUTION_PROFILE_REPAIR_INPUT_GZIP_2: ${{ secrets.SOLUTION_PROFILE_REPAIR_INPUT_GZIP_2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, apply, and verify idempotent retry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOLUTION_PROFILE_REPAIR_INPUT_GZIP_1"
          test -n "$SOLUTION_PROFILE_REPAIR_INPUT_GZIP_2"
          umask 077
          input="$RUNNER_TEMP/solution-profile-repair.json"
          receipt="$RUNNER_TEMP/solution-profile-repair-receipt.json"
          printf '%s%s' \
            "$SOLUTION_PROFILE_REPAIR_INPUT_GZIP_1" \
            "$SOLUTION_PROFILE_REPAIR_INPUT_GZIP_2" \
            | base64 --decode | gzip --decompress > "$input"
          node --experimental-strip-types scripts/apply-solution-profile-revisions.mjs \
            --packet "$input" --remote
          node --experimental-strip-types scripts/apply-solution-profile-revisions.mjs \
            --packet "$input" --remote --apply --confirm-exact-target --receipt "$receipt"
          node --experimental-strip-types scripts/apply-solution-profile-revisions.mjs \
            --packet "$input" --remote --apply --confirm-exact-target --receipt "$receipt"
          test "$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).result" "$receipt")" = "applied"

      - name: Upload redacted repair receipt
        uses: actions/upload-artifact@v4
        with:
          name: solution-profile-repair-receipt
          path: ${{ runner.temp }}/solution-profile-repair-receipt.json
          retention-days: 7

name: Validate and publish Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: cloudflare-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'active' }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
      reuse_run: ${{ steps.reuse.outputs.run_id }}
      deploy_worker: ${{ steps.changes.outputs.deploy_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify the exact source tree
        id: tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Reuse successful PR validation for identical main
        if: github.event_name == 'push'
        id: reuse
        uses: actions/github-script@v7
        env:
          SOURCE_TREE: ${{ steps.tree.outputs.sha }}
        with:
          script: |
            const find = require('./scripts/find-validated-build.cjs');
            try {
              const run = await find({ github, context, tree: process.env.SOURCE_TREE });
              core.setOutput('run_id', run);
              core.info(run ? `Reusing validated source tree from run ${run}` : 'No identical validated tree; running full validation.');
            } catch (error) {
              core.warning(`Validation reuse unavailable; running full validation: ${error.message}`);
            }
      - name: Classify the main-branch change
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "deploy_worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deploy_worker=false
          while IFS= read -r file; do
            case "$file" in
              docs/engineering/*) deploy_worker=true; break ;;
              data/*|practice/*|audio-answers/*|docs/*|README.md|AGENTS.md) ;;
              *) deploy_worker=true ;;
            esac
          done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "deploy_worker=$deploy_worker" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.reuse_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact Engineering source cache
        uses: actions/cache@v4
        with:
          path: .cache/engineering-journal
          key: engineering-journal-${{ runner.os }}-${{ hashFiles('engineering-journal/trusted-sources.json') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate local D1 migrations and content import
        run: |
          pnpm db:migrate:local
          pnpm content:import:local
      - name: Restore lint cache
        uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - name: Lint
        run: pnpm lint
      - name: Build once and run source and bundle checks
        run: |
          pnpm build
          pnpm test:fast
          node --experimental-strip-types --test tests/rendered-html.test.mjs
      - name: Package the validated Worker
        run: tar -cf validated-worker.tar dist .cache/eslint
      - name: Retain the validated Worker
        uses: actions/upload-artifact@v4
        with:
          name: validated-worker-${{ needs.plan.outputs.tree }}
          path: validated-worker.tar
          retention-days: 7
          if-no-files-found: error

  integration:
    needs: plan
    if: needs.plan.outputs.reuse_run == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated Worker integration group
        run: node scripts/run-tests.mjs --integration --shard=${{ matrix.shard }}/4

  validate:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [plan, build, integration]
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ needs.plan.outputs.tree }}
      artifact_run: ${{ needs.plan.outputs.reuse_run || github.run_id }}
      deploy_worker: ${{ needs.plan.outputs.deploy_worker }}
    steps:
      - name: Require every validation group or an identical validated tree
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse_run }}
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ -z "$REUSE_RUN" ]]; then
            test "$BUILD_RESULT" = success
            test "$INTEGRATION_RESULT" = success
          fi

  publish:
    if: always() && needs.validate.result == 'success' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight owner-scoped Loop identity uniqueness
        shell: bash
        run: |
          duplicate_groups="$(
            pnpm exec wrangler d1 execute DB --remote --json --command \
              "SELECT COUNT(*) AS duplicate_groups FROM (SELECT owner_id, lower(trim(company)) AS company_key, lower(trim(role_title)) AS role_key, COUNT(*) AS row_count FROM interview_loops GROUP BY owner_id, company_key, role_key HAVING row_count > 1);" |
              node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const rows = JSON.parse(body); process.stdout.write(String(rows[0].results[0].duplicate_groups)); });'
          )"
          echo "loop_identity_preflight phase=duplicate_audit duplicate_groups=${duplicate_groups}"
          test "$duplicate_groups" = "0"

      - name: Apply production D1 migrations
        run: pnpm db:migrate:remote

      - name: Refresh the production content projection
        run: pnpm content:import:remote

      - name: Download the validated Worker
        if: needs.validate.outputs.deploy_worker == 'true'
        uses: actions/download-artifact@v4
        with:
          name: validated-worker-${{ needs.validate.outputs.tree }}
          run-id: ${{ needs.validate.outputs.artifact_run }}
          github-token: ${{ github.token }}

      - name: Restore the validated Worker
        if: needs.validate.outputs.deploy_worker == 'true'
        run: tar -xf validated-worker.tar

      - name: Seed the main-branch lint cache from validated files
        if: needs.validate.outputs.deploy_worker == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}

      - name: Deploy Worker
        if: needs.validate.outputs.deploy_worker == 'true'
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Deploy Codex and Chrome bridge
        if: needs.validate.outputs.deploy_worker == 'true'
        run: pnpm exec wrangler deploy --config wrangler.mcp.jsonc

      - name: Verify Codex and Chrome bridge
        if: needs.validate.outputs.deploy_worker == 'true'
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 2 https://limitless-mcp.vinosama.workers.dev/health

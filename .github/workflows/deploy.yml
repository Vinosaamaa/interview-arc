name: Validate and publish Cloudflare

# Pull requests are validated against a local D1 database. After a merge to
# main, the production D1 projection is refreshed only after validation passes.
# Content/documentation-only merges skip the Worker build and deployment.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      deploy_worker: ${{ steps.changes.outputs.deploy_worker }}
      repair_vortex_profile: ${{ steps.changes.outputs.repair_vortex_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local D1 migrations and content import
        run: |
          pnpm db:migrate:local
          pnpm content:import:local

      - name: Lint
        run: pnpm lint

      - name: Build and test
        run: pnpm test

      - name: Classify the main-branch change
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "deploy_worker=true" >> "$GITHUB_OUTPUT"
            echo "repair_vortex_profile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_worker=false
          repair_vortex_profile=false
          while IFS= read -r file; do
            case "$file" in
              scripts/repairs/vortex-profile-v2.json|scripts/repairs/vortex-profile-v2.mjs) repair_vortex_profile=true ;;
            esac
            case "$file" in
              data/*|practice/*|audio-answers/*|docs/*|README.md|AGENTS.md) ;;
              *) deploy_worker=true ;;
            esac
          done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "deploy_worker=$deploy_worker" >> "$GITHUB_OUTPUT"
          echo "repair_vortex_profile=$repair_vortex_profile" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production D1 migrations
        run: pnpm db:migrate:remote

      - name: Apply guarded VortexNetTech Solution Profile revision 2 repair
        if: needs.validate.outputs.repair_vortex_profile == 'true'
        run: >-
          node scripts/repairs/vortex-profile-v2.mjs
          --remote --apply --confirm-exact-target
          --receipt "$RUNNER_TEMP/vortex-profile-v2-repair-receipt.json"

      - name: Upload VortexNetTech repair receipt
        if: always() && needs.validate.outputs.repair_vortex_profile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-profile-v2-repair-receipt
          path: ${{ runner.temp }}/vortex-profile-v2-repair-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Refresh the production content projection
        run: pnpm content:import:remote

      - name: Build Worker
        if: needs.validate.outputs.deploy_worker == 'true'
        run: pnpm build

      - name: Deploy Worker
        if: needs.validate.outputs.deploy_worker == 'true'
        run: pnpm exec wrangler deploy

      - name: Deploy Codex and Chrome bridge
        if: needs.validate.outputs.deploy_worker == 'true'
        run: pnpm exec wrangler deploy --config wrangler.mcp.jsonc

      - name: Verify Codex and Chrome bridge
        if: needs.validate.outputs.deploy_worker == 'true'
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 2 https://limitless-mcp.vinosama.workers.dev/health

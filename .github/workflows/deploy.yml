name: Deploy to Cloudflare

# On merge to main: apply D1 migrations, mirror Git content into D1, build, and
# deploy the Worker to your Cloudflare account. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - a token with Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account id
# The Worker's SITE_PASSCODE / SESSION_SECRET are set once via `wrangler secret`
# and persist across deploys, so CI never handles them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (production)
        run: pnpm db:migrate:remote

      - name: Import content into D1 (production)
        run: pnpm content:import:remote

      - name: Build
        run: pnpm build

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

const $=s=>document.querySelector(s);const nav=[['today','Today'],['courses','Courses'],['materials','Materials'],['library','Library'],['history','History']];let active='materials',updated=true,playing=false;const metrics=(a,b,c)=>`<dl class="learn-hero-metrics">${[a,b,c].map(([v,l])=>`<div><dt>${l}</dt><dd>${v}</dd></div>`).join('')}</dl>`;

const courseRail=`<header><span class="meta">Module path</span><h2>Network Essentials</h2><p class="muted">Module 1 · The request path</p></header><ol class="path"><li><strong>Names and addresses</strong><small>Completed</small></li><li class="active"><strong>TCP connections</strong><small>Current · Lesson revision 2</small></li><li><strong>Timeouts and retries</strong><small>Planned</small></li></ol>`;

function material(){return hero('MATERIALS','Keep the ideas.<br>Keep the source.','Return to what matters.','Detailed notes from videos, articles and courses, with the original material beside them.',[['3','Published materials'],['2','Source types'],['Full','Timestamped transcript']])+panes(`<header><span class="meta">Published materials</span><h2>Your reading shelf</h2><form class="search" onsubmit="event.preventDefault();searchRows(this)"><input aria-label="Search materials" placeholder="Title or topic"><button>Find</button></form></header>${row('Insertion sort and merge sort','MIT 6.046J · Video notes',true,'materials')}${row('Understanding the TCP handshake','Article · Network Essentials',false,'materials')}${row('Designing a URL shortener','Uploaded HTML · System design',false,'materials')}`,`<details class="contents"><summary>Contents</summary><a href="#overview">Overview</a><a href="#approaches">The two approaches</a><a href="#original">Full source</a></details><div class="meta">MIT 6.046J · Lecture notes</div><h2>Insertion sort and<br>merge sort</h2><p class="muted">Video · Full source reviewed · Timestamped transcript</p><a href="#original">Open original source ↓</a><section id="overview" class="reading"><h3>Overview</h3><p>This lecture introduces the analysis of algorithms by comparing two ways to sort a sequence. Insertion sort builds a sorted prefix one item at a time. Merge sort divides the problem, sorts each half, and combines the results.</p><p>The important distinction is how the amount of work grows with the input. The notes connect each algorithm’s steps to its running time, then show why asymptotic analysis matters when choosing an approach.</p></section><section id="approaches" class="reading"><h3>Two approaches to the same problem</h3><p>Insertion sort is easy to follow and efficient for small or nearly sorted inputs. Its worst-case work grows quadratically. Merge sort performs linear work at each level of a logarithmic recursion tree.</p></section><section class="notes"><h3>Key notes</h3><ul><li>Define the input size before comparing running times.</li><li>Separate the correctness argument from the performance analysis.</li><li>Use the original transcript to revisit proofs and examples.</li></ul></section><details id="original"><summary>Full YouTube transcript</summary><div class="actions"><button class="primary" onclick="openTranscript()">Open full screen</button><button onclick="toast('The product downloads the complete timestamped transcript as TXT.')">Download transcript</button></div><label>Find in transcript<input placeholder="Word or phrase" oninput="filterTranscript(this)"></label><div class="sourcebox transcript-source"><p><span class="meta">00:00</span><br>Welcome to Introduction to Algorithms. We begin with the problem of sorting a sequence.</p><p><span class="meta">01:24</span><br>We will look at two different approaches and compare the amount of work they do as the input grows.</p><p><span class="meta">04:10</span><br>Insertion sort keeps a sorted prefix and inserts the next element into the right position.</p><p class="review-note">Illustrative transcript excerpt for this mock. The production reader must show every retrieved caption with its timestamp.</p></div><div class="toast"></div></details><p class="review-note">Mock content illustrates layout and reading depth. The published page keeps every original source part.</p>`)}

function openTranscript(){document.querySelector('#fullTranscript').innerHTML=document.querySelector('.transcript-source').outerHTML;document.querySelector('#transcriptDialog').showModal()}function filterTranscript(input){let scope=input.closest('dialog')||input.closest('details');scope.querySelectorAll('.transcript-source p').forEach(p=>p.hidden=!p.textContent.toLowerCase().includes(input.value.toLowerCase()))}function historyReplace(){window.history.replaceState(null,'','#'+active)}function pane(value){$('.twopane').dataset.pane=value;document.querySelectorAll('.phonepane button').forEach((b,i)=>b.classList.toggle('active',(i===0)===(value==='index')))}function toast(s){let e=$('.toast');e.textContent=s;e.classList.add('show')}function send(s){if($('#editform').classList.contains('open')){$('#buttonlabel').value=s;$('#buttonmessage').value=s;return}toast('Message preview: '+s)}function addButton(){let name=$('#buttonlabel').value.trim(),message=$('#buttonmessage').value.trim();if(!name||!message)return;let b=document.createElement('button');b.textContent=name;b.onclick=()=>send(message);$('#buttons').insertBefore(b,$('#buttons').lastElementChild);$('#editform').classList.remove('open');toast('Button saved in this mock. No message sent.')}let page=1,hold;function pdfPage(delta){page=Math.max(1,Math.min(28,page+delta));$('#pdfPage').textContent='Page '+page+' of 28'}function skip(n){$('#progress').value=Math.max(0,Math.min(100,+$('#progress').value+n/36));$('#elapsed').textContent='12:'+(n>0?'05':'00')}function searchRows(form){let q=form.querySelector('input').value.toLowerCase();document.querySelectorAll('.rail .row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}$('#screen').onchange=()=>{render();window.scrollTo(0,0)};let initial=location.hash.slice(1);if([...$('#screen').options].some(o=>o.value===initial))$('#screen').value=initial;render();

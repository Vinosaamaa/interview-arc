  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#617470" font-size="15">
    <text x="80" y="360">Not this</text>
    <text x="80" y="386" fill="#102A2A">Stacked INTERVIEW / Workspace wordmark · I L E letter tiles · contents or peach pills · extra Architecture tabs</text>
    <text x="80" y="430">Keep</text>
    <text x="80" y="456" fill="#102A2A">50px application bar text switch · 980px even destination dock · Career Materials CM glyph unchanged</text>
  </g>


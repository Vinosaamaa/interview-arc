    <text x="244" y="86" fill="#EDF7F4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">01 Today</text>
    <text x="244" y="112" fill="#8EA7A2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Destination nav stays numbered. Identity is the plate, not a second Workspace caption.</text>

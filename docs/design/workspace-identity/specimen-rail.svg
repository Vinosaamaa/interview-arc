      <g transform="translate(12,11)" fill="none" stroke="#315CA8" stroke-width="2.2" stroke-linejoin="round">
        <path d="M8 4.2h12.2A3.2 3.2 0 0 1 23.4 7.4v15.5H11.1A3.2 3.2 0 0 1 7.9 19.7V4.2Z"/>
        <path d="M7.9 7.7H5.9A2.5 2.5 0 0 0 3.4 10.2v12.6A3 3 0 0 0 6.4 25.8h14.1" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Interview Arc workspace identity specimen rail</title>
  <desc id="desc">Same chamfered 28-pixel plate for Interview, Learn, and Engineering. Distinct motifs. Selected fill lives on the plate. Later is a quiet unavailable status.</desc>

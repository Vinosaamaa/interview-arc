    <text x="28" y="36" fill="#8EA7A2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="0.16em">LEFT RAIL ON MINERAL TEAL</text>
    <g transform="translate(28,56)">

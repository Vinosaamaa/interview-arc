    <text x="68" y="568" class="sans body" fill="#304d48">Interview Arc spans the website, the native Voice companion, and the Live</text><text x="68" y="594" class="sans body" fill="#304d48">practice surface. Each repository authors public-safe evidence; readers</text><text x="68" y="620" class="sans body" fill="#304d48">consume one normalized, commit-pinned projection.</text>
    <text x="68" y="683" class="serif" font-size="31" fill="#153a35">Module boundary</text>
    <text x="68" y="720" class="sans body" fill="#304d48">The Journal Module validates records, rejects unsafe content, derives</text><text x="68" y="746" class="sans body" fill="#304d48">correction history and backlinks, and emits deterministic Statistics.</text>
